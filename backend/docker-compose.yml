version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: golden_house_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golden_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golden_secret}
      POSTGRES_DB: ${POSTGRES_DB:-golden_house_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden_user -d golden_house_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
