version: '3.8'

services:
  # Base de données relationnelle PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: golden_house_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golden_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golden_secret}
      POSTGRES_DB: ${POSTGRES_DB:-golden_house_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialisation automatique du schéma et des données de test au premier lancement
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden_user -d golden_house_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interface web de visualisation et gestion de la base de données
  adminer:
    image: adminer:latest
    container_name: golden_house_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
